[package]
name = "kinbase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Three-store knowledge system for brownfield coding work"
build = "build.rs"

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.44", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.6.6", features = ["derive"] }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
libc = "=0.2.189"
rand = "=0.8.7"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
unicode-normalization = "=0.1.25"
uuid = { version = "=1.21.0", features = ["v4"] }
sha2 = "=0.10.9"
toml = "=0.8.23"

[features]
# Personal recall through Kindex: `kinbase recall` and the hand-off of host
# transcripts to a Kindex graph. For testing only, with synthetic or public
# conversations (the memory benchmarks): it can send historical Personal-store
# text to a model provider, which the threat model does not allow for real
# Personal data. Off in normal builds.
personal-recall = []

[dev-dependencies]
tempfile = "=3.27.0"
